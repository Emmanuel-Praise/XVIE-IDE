# xvie-agent routing configuration
#
# Models ranked by ACTUAL test results (easy/medium/hard coding challenges).
# Tested 2026-08-22 against NVIDIA NIM API with tool-calling. Refreshed
# 2026-09-07: only models from the current NVIDIA build catalog (verified live
# with tool-calling). Nimtron 3 Super retired → Nemotron 3 Ultra 550B is the
# fleet flagships, with Kimi K3 / Lightning / Laguna as verified fallbacks.
#
# Tier 1: Always pass all 3 challenges (reliable tool callers)
# Tier 2: Pass easy+medium, sometimes hard
# Tier 3: Inconsistent — sometimes outputs JSON text instead of tool calls
# Tier 4: Never pass — no tool calls (DO NOT USE for agentic coding)

roles:
  reliable:
    requires:
      supports_tools: true
    temperature: 0.1
    max_tokens: 16000
    models:
      # --- Tier 1: Proven reliable across all difficulty levels ---
      - provider: nvidia
        id: "nvidia/nemotron-3-ultra-550b-a55b"
        display_name: "Nemotron 3 Ultra 550B"
        context_window: 131072
        supports_tools: true
        supports_reasoning: true
        plan_compliance: strong
        role_tags: [reliable, coding, planning, agentic]
      - provider: nvidia
        id: "moonshotai/kimi-k3"
        display_name: "Kimi K3"
        context_window: 131072
        supports_tools: true
        supports_reasoning: true
        plan_compliance: strong
        role_tags: [reliable, coding, planning, agentic]
