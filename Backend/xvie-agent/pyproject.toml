[project]
name = "xvie-agent"
version = "0.1.0"
description = "A multi-model agentic coding engine"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
visual = ["playwright>=1.45"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
xvie-agent = "xvie_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xvie_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
